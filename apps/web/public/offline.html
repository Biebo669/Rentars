<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rentars — You're offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #1f2937;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #111827;
    }
    p {
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #2563eb;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      min-height: 44px;
    }
    .btn:hover { background: #1d4ed8; }
    .badge {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
    .update-banner {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 0.75rem;
      max-width: calc(100% - 2rem);
      background: #111827;
      color: #f9fafb;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      font-size: 0.85rem;
      z-index: 10;
    }
    .update-banner.visible { display: flex; }
    .update-banner .btn {
      padding: 0.4rem 0.9rem;
      font-size: 0.8rem;
      min-height: 36px;
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <span class="icon" aria-hidden="true">📡</span>
    <h1>You're offline</h1>
    <p>
      It looks like you lost your internet connection. Check your network settings
      and try again — Rentars will reconnect automatically when you're back online.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Try again
    </button>
    <div class="badge">Rentars — Decentralized P2P Rentals on Stellar</div>
  </main>
  <div class="update-banner" id="sw-update-banner" role="status" aria-live="polite">
    <span>A new version of Rentars is available.</span>
    <button class="btn" id="sw-update-reload" type="button">Reload</button>
  </div>
  <script>
    (function () {
      var banner = document.getElementById('sw-update-banner');
      var reloadBtn = document.getElementById('sw-update-reload');
      var reloadRequested = false;

      function showBanner() {
        if (banner) banner.classList.add('visible');
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'SW_UPDATE_AVAILABLE') {
            showBanner();
          }
        });

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloadRequested) {
            window.location.reload();
          }
        });

        if (reloadBtn) {
          reloadBtn.addEventListener('click', function () {
            var worker = navigator.serviceWorker.controller;
            if (worker) {
              reloadRequested = true;
              worker.postMessage({ type: 'SKIP_WAITING' });
            } else {
              window.location.reload();
            }
          });
        }
      }
    })();
  </script>
</body>
</html>
